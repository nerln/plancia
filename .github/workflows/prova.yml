# Il collaudo a ogni push, su Linux, Windows e macOS, con Python 3.9 e 3.12.
#
# Il cuore di Plancia e' python e basta: se passa qui vuol dire che non ha niente
# di macOS sotto. macOS resta la piattaforma principale (c'e' l'app nativa, e' li'
# che gira tutto); su Windows e Linux Plancia si installa con `plancia install` e
# la dashboard si apre nel browser.
#
# Su Windows i comandi si lanciano con `python`, non `python3`.
#
# Cosa e' provato dove:
# - tools/prove/piattaforma.py controlla i comandi che Plancia COSTRUISCE per tutte
#   e tre le piattaforme (terminale, appunti, voce, notifica, avvio automatico,
#   MCP, hook), senza eseguirli. Blocca su tutti e tre i sistemi. Su un Windows vero
#   e' girata al primo giro completo della CI (run 36573487970): 147 passate e 0
#   fallite su tutti e due i Python. Se un giorno esce rossa, il rosso della prova
#   va corretto la', non tolto il passo.
# - il front (tools/prova-front.py) su Windows BLOCCA come sugli altri sistemi: al
#   primo giro completo (run 36573487970) ha dato 442 passate e 0 fallite su tutti
#   e due i Python, ed e' stato visto verde, non dedotto.
# - la suite intera (tools/prova.py) su Windows BLOCCA come sugli altri sistemi: il
#   giro del 29/09 sul commit 2a53c16 (run 36635628748) ha dato 4118 passate e 0 fallite
#   su tutti e due i Python, visto e non dedotto. Il primo giro completo (run 36573487970)
#   cadeva in tre punti (percorsi finti alla POSIX, la casa finta dell'installazione, uno
#   script di bin/ lanciato senza interprete); poi (run 36582338633) 2964 passate e 1070
#   fallite, quasi tutte nel guardiano e nei compartimenti, che su Windows non sono
#   supportati: sono spenti nel codice (decidono dal sistema vero, os.name, mai da una
#   variabile) e le loro prove sono "saltato: non supportato su Windows", controllo per
#   controllo, con lo stesso totale degli altri sistemi. Le altre erano l'hook di sessione
#   lanciato dalla prova senza `-X utf8` (quelli scritti da `plancia install` lo hanno;
#   ora l'hook e' indipendente dalla tabella di caratteri, vedi tools/prove/windows-hook.py),
#   le cartelle escluse con la lettera di unita', il link di un progetto con altre barre, la
#   voce che passa il prompt a `claude -p` da stdin (un `claude.cmd` di npm taglia
#   l'argomento alla prima riga a capo) e prove con aspettative POSIX. Il passo ha un
#   tetto di tempo, perche' una prova appesa non tenga il collaudo per ore.
# - non e' verificato che setup-python fornisca Python 3.9 su macos-latest
#   (arm64): se al primo giro quel job non parte, escludere la combinazione con
#   `exclude` (3.9 resta provato su Linux e Windows).
name: collaudo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  prova:
    name: collaudo (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: piattaforma (Linux, macOS)
        if: runner.os != 'Windows'
        run: python3 tools/prove/piattaforma.py
      - name: piattaforma (Windows)
        if: runner.os == 'Windows'
        run: python tools/prove/piattaforma.py
      - name: collaudo (Linux, macOS)
        if: runner.os != 'Windows'
        run: python3 tools/prova.py
      - name: collaudo (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 45
        run: python tools/prova.py
      - name: front (Linux, macOS)
        if: runner.os != 'Windows'
        run: python3 tools/prova-front.py
      - name: front (Windows)
        if: runner.os == 'Windows'
        run: python tools/prova-front.py
