# Il collaudo a ogni push, su Linux, Windows e macOS, con Python 3.9 e 3.12.
#
# Il cuore di Plancia e' python e basta: se passa qui vuol dire che non ha niente
# di macOS sotto. macOS resta la piattaforma principale (c'e' l'app nativa, e' li'
# che gira tutto); su Windows e Linux Plancia si installa con `plancia install` e
# la dashboard si apre nel browser.
#
# Su Windows i comandi si lanciano con `python`, non `python3`.
#
# Cosa e' provato dove:
# - tools/prove/piattaforma.py controlla i comandi che Plancia COSTRUISCE per tutte
#   e tre le piattaforme (terminale, appunti, voce, notifica, avvio automatico,
#   MCP, hook), senza eseguirli. Blocca su tutti e tre i sistemi. Su un Windows vero
#   e' girata al primo giro completo della CI (run 36573487970): 147 passate e 0
#   fallite su tutti e due i Python. Se un giorno esce rossa, il rosso della prova
#   va corretto la', non tolto il passo.
# - il front (tools/prova-front.py) su Windows BLOCCA come sugli altri sistemi: al
#   primo giro completo (run 36573487970) ha dato 442 passate e 0 fallite su tutti
#   e due i Python, ed e' stato visto verde, non dedotto.
# - la suite intera (tools/prova.py) su Windows gira fino in fondo ma per ora NON blocca.
#   Il primo giro completo (run 36573487970) cadeva in tre punti (percorsi finti alla
#   POSIX, la casa finta dell'installazione, uno script di bin/ lanciato senza
#   interprete); dopo la correzione il giro del 29/09 (run 36582338633, commit 477b56d)
#   e' arrivato in fondo con 2964 passate e 1070 fallite. Le 1070 erano: 898 nel
#   guardiano e 141 nei compartimenti (che su Windows non sono supportati: ora spenti nel
#   codice e le loro prove sono "saltato: non supportato su Windows", controllo per
#   controllo, con lo stesso totale degli altri sistemi), e 31 in altri moduli: l'hook di
#   sessione che su Windows non dava il briefing (stdout in cp1252 e una freccia: vedi
#   tools/prove/windows-hook.py), le cartelle escluse con la lettera di unita', il link
#   di un progetto scritto con altre barre, e prove con aspettative POSIX o di un
#   sistema che non e' Windows. Quelle correzioni sono provate con un Windows imitato
#   sul Mac, ma NON sono ancora state viste girare su un Windows vero: finche' non si
#   vede un giro verde il passo resta rosso senza fermare il resto, con un tetto di tempo
#   perche' una prova appesa non tenga il collaudo per ore. Al primo giro verde si toglie
#   `continue-on-error`. Su Linux e macOS il rosso blocca come sempre.
# - non e' verificato che setup-python fornisca Python 3.9 su macos-latest
#   (arm64): se al primo giro quel job non parte, escludere la combinazione con
#   `exclude` (3.9 resta provato su Linux e Windows).
name: collaudo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  prova:
    name: collaudo (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: piattaforma (Linux, macOS)
        if: runner.os != 'Windows'
        run: python3 tools/prove/piattaforma.py
      - name: piattaforma (Windows)
        if: runner.os == 'Windows'
        run: python tools/prove/piattaforma.py
      - name: collaudo (Linux, macOS)
        if: runner.os != 'Windows'
        run: python3 tools/prova.py
      - name: collaudo (Windows, non blocca finche' non si vede un giro verde)
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 45
        run: python tools/prova.py
      - name: front (Linux, macOS)
        if: runner.os != 'Windows'
        run: python3 tools/prova-front.py
      - name: front (Windows)
        if: runner.os == 'Windows'
        run: python tools/prova-front.py
