<!doctype html>
<html lang="it" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="plancia-token" content="__PLANCIA_TOKEN__">
<title>Plancia</title>
<link rel="stylesheet" href="/style.css?v=__PLANCIA_V__">
<link rel="stylesheet" href="/moto.css?v=__PLANCIA_V__">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7.5' fill='%2312161f'/><g transform='scale(.03125) translate(512 512) scale(1.35) translate(-512 -512) rotate(40 512 512)' stroke-width='40' stroke-linejoin='round'><path d='M512 190L634 500H390Z' fill='%23e8934e' stroke='%23e8934e'/><path d='M390 524H634L512 834Z' fill='%23f4efe6' stroke='%23f4efe6'/></g></svg>">
</head>
<body>
<div id="app">
  <aside class="rail">
    <div class="brand">
      <svg viewBox="0 0 32 32" class="brand-mark" aria-hidden="true">
        <g transform="scale(.03125) translate(512 512) scale(1.7) translate(-512 -512) rotate(40 512 512)" stroke-width="40" stroke-linejoin="round" stroke="currentColor">
          <path d="M512 190L634 500H390Z" fill="currentColor"/>
          <path d="M390 524H634L512 834Z" fill="currentColor" opacity=".62"/>
        </g>
      </svg>
      <div>
        <b>Plancia</b>
        <span data-t="lavoro con l'IA">lavoro con l'IA</span>
      </div>
    </div>
    <nav>
      <a href="#/oggi" data-view="oggi"><i data-i="oggi"></i><span data-t="Oggi">Oggi</span></a>
      <a href="#/cerca" data-view="cerca"><i data-i="cerca"></i><span data-t="Cerca">Cerca</span><em class="tasto">/</em></a>
      <a href="#/lavagna" data-view="lavagna"><i data-i="lavagna"></i><span data-t="Lavagna">Lavagna</span><em id="badge-lavagna"></em></a>
      <a href="#/progetti" data-view="progetti"><i data-i="progetti"></i><span data-t="Progetti">Progetti</span></a>
      <a href="#/social" data-view="social"><i data-i="social"></i><span data-t="Social">Social</span><em id="badge-social"></em></a>
      <a href="#/memoria" data-view="memoria"><i data-i="memoria"></i><span data-t="Memoria">Memoria</span></a>
      <a href="#/archivio" data-view="archivio"><i data-i="archivio"></i><span data-t="Archivio">Archivio</span></a>
    </nav>
    <div class="rail-foot">
      <div class="buttons">
        <button id="btn-theme" class="ghost" data-t="Tema">Tema</button>
        <button id="btn-lang" class="ghost" title="lingua">IT</button>
        <a class="ghost" href="#/benvenuto" data-t="Guida">Guida</a>
      </div>
      <div class="sync-line"><span id="sync-dot" class="dot"></span><span id="sync-text">—</span></div>
    </div>
  </aside>

  <main>
    <header class="topbar">
      <button class="search-open" id="btn-search">
        <svg viewBox="0 0 24 24" width="15" height="15"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16.5 16.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span data-t="Cerca in tutto il lavoro">Cerca in tutto il lavoro</span><kbd>⌘K</kbd>
      </button>
      <div class="topbar-actions">
        <span id="spia-memoria" class="spia-memoria" hidden></span>
        <button id="btn-sync" class="ghost" data-t="Aggiorna">Aggiorna</button>
        <a class="ghost" id="btn-briefing" href="#/briefing" data-t="Briefing">Briefing</a>
      </div>
    </header>
    <div id="view"></div>
  </main>
</div>

<div id="palette" class="palette" hidden>
  <div class="palette-box">
    <input id="palette-input" data-t="Cerca sessioni, memorie, task, post, commit…" placeholder="Cerca sessioni, memorie, task, post, commit…" autocomplete="off">
    <div id="palette-results"></div>
  </div>
</div>

<div id="drawer" class="drawer" hidden>
  <div class="drawer-panel">
    <button class="drawer-close" id="drawer-close">✕</button>
    <div id="drawer-body"></div>
  </div>
</div>

<audio id="player" hidden></audio>
<div id="toast" class="toast" hidden></div>
<script>document.documentElement.dataset.errori = '0';
window.addEventListener('error', () => { document.documentElement.dataset.errori = String(+document.documentElement.dataset.errori + 1); });
window.addEventListener('unhandledrejection', () => { document.documentElement.dataset.errori = String(+document.documentElement.dataset.errori + 1); });
</script>
<script src="/app.js?v=__PLANCIA_V__"></script>
</body>
</html>
