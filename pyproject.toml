[project]
name = "plancia"
version = "1.1.0"
description = "A ledger of the work you did with AI, that outlives the sessions."
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.9"
authors = [{name = "Eugenio Nerelli"}]

# No runtime dependencies, on purpose. Every dependency is a maintainer who can
# push code onto this machine; the standard library is enough for this job.
dependencies = []

[project.scripts]
plancia = "plancia.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# seed.json travels inside the package: config.py looks for it next to the
# modules, which holds both in a checkout and in site-packages. The dashboard
# files under web/ are a sibling of the package, so they stay out of the wheel
# rather than being dropped into site-packages under a name anyone could claim.
packages = ["plancia"]
